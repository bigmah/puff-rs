[package]
name = "puff-rs"
version = "0.1.0"
edition = "2021"
description = "PufferLib 5.0 in Rust: its trainer on wgpu (Metal, Vulkan, DX12) and its vecenv, for envs written in Rust"
repository = "https://github.com/bigmah/puff-rs"

[lib]
name = "pufferl"
path = "src/lib.rs"

[dependencies]
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
libc = "0.2"
rayon = "1"
puffer-env = { path = "crates/puffer-env" }

[workspace]
members = [".", "crates/puffer-env"]

[[example]]
name = "squared"
path = "examples/squared/main.rs"
test = true

[lints.clippy]
# A remainder reads as the arithmetic it is
manual_is_multiple_of = "allow"

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 1
