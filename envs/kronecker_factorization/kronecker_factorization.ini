[base]
env_name = kronecker_factorization
checkpoint_interval = 50

[vec]
total_agents = 1024
num_buffers = 1
num_threads = 8

[env]
# S is rows x cols, up to 32 x 32
rows = 16
cols = 16
# 1 leaves out naming S itself as its one factor, as kron.h's count does
at_least_two = 1
# Paid times (fewest numbers / numbers named) for a list that rebuilds S
solve_reward = 1.0
# For a list that does not
fail_penalty = 1.0
# Largest relative error in the rebuilt S that still counts as S
tolerance = 1e-6

[train]
total_timesteps = 20_000_000
