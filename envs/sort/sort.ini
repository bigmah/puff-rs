[base]
env_name = sort
checkpoint_interval = 50

[vec]
total_agents = 1024
num_buffers = 1
num_threads = 8

[env]
# Swaps allowed before the episode fails. Sorting 8 never takes more than 7
max_steps = 16
step_cost = 0.02
solve_reward = 1.0
# For ending unsorted, scaled by how far from sorted: all of it at 7 swaps away
fail_penalty = 1.0

[train]
total_timesteps = 20_000_000
