# Peach's Secret Slide, star 2: reach the bottom inside 21 seconds of the slide's
# own timer, and the star spawns there. Every slide run on file takes this one,
# star 1 being the box at the bottom that none of them breaks. Gravity does most
# of the work, and the way to lose is to go over the side.
[env]
star = pss-2
# The clock is the star's own: 21 seconds of the slide's timer, and the 674 run
# on file touches it at frame 674. At 1500 (the clock before), an hour of runs
# learned to take the slide carefully, got within 350 units of the star a
# thousand frames in, and never took it. With go_explore_clock, an episode from
# the archive has only what is left of these 750.
max_ticks = 750
# A death ends the episode. With 750 frames, a run back from the top never makes
# the star; with 1500 and respawn on, a fall forfeited the rest of the progress
# pay, so the policy learned caution: top speed 95 -> 50.
respawn = 0
# Episodes that start from the archive anywhere but the frontier explore, with
# 1500 frames of their own, so the archive can learn the slide in stages; the
# ones from the top and from the frontier race on the 750.
explore_ticks = 1500
# Where the star spawns, at the bottom: where Mario touches it in the runs on
# file.
star_x = -6358.0
star_y = -4300.0
star_z = 4700.0
# With the star placed, progress points the way down, and novelty that never
# fades only pays for wandering: in the 2026-09-16 runs it out-paid the star.
novelty_episode = 0.0
