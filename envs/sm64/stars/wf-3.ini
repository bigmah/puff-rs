# Whomp's Fortress, star 3: Shoot into the Wild Blue, on a ledge on the far
# side of the fortress's outer wall, which the cannon is for and wall kicks get
# to without it. It is in the course in every act, and act 3 is its own.
[env]
star = wf-3
# The star object as act 3's level script places it: the one whose behavior
# parameters name star index 2, read out of the object pool after the savestate
# loads.
star_x = -2500.0
star_y = 1500.0
star_z = -750.0
# Forty seconds: the pace of an explorer that has to cross the fortress and
# climb to the ledge, not of a run that knows the way. Episodes that start from
# the archive anywhere but the frontier get sixty to explore with.
max_ticks = 1200
explore_ticks = 1800
# A fortress in the sky, as for wf-2: a death keeps the clock and puts the game
# back instead of ending the episode.
respawn = 1
# With the star placed, progress points the way, and novelty that never fades
# only pays for wandering: on the slide it out-paid the star.
novelty_episode = 0.0
